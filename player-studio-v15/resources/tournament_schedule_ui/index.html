<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>锦标赛 · 赛程中心</title><style>/*SCHEDULE_CSS*/</style></head>
<body><a class="skip" href="#content">跳到赛程</a><div class="app">
<header class="topbar"><button id="back" class="back" type="button" aria-label="返回游戏"><span aria-hidden="true">←</span> 返回游戏</button><div class="brand"><i></i> MATCH CENTRE <span>赛程中心</span></div><button id="refresh" class="icon-button" type="button" aria-label="刷新已保存赛果">↻</button></header>
<main id="content"><section class="hero"><div class="hero-copy"><div class="eyebrow"><span id="difficulty"></span><span class="line"></span><span id="progress-label"></span></div><h1 id="title"></h1><p id="subtitle"></p><div class="hero-stats" id="hero-stats"></div></div><div class="trophy" aria-hidden="true"><svg viewBox="0 0 180 180"><circle cx="90" cy="86" r="73"/><circle cx="90" cy="86" r="61"/><path d="M60 40h60v37c0 24-14 37-30 37S60 101 60 77V40Zm0 8H39v16c0 20 12 30 29 31m52-47h21v16c0 20-12 30-29 31M90 114v23m-22 10h44m-32-10h20l7 10H73l7-10Z"/><path class="star" d="m90 55 4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1Z"/></svg><span>THE ROAD TO GLORY</span></div><aside class="next-card" id="next-card"></aside></section>
<nav id="stages" class="stages" aria-label="赛事阶段"></nav>
<div class="workspace"><div class="viewbar"><div class="tabs" role="tablist" aria-label="赛程视图"><button id="tab-bracket" role="tab" data-view="bracket">对阵图</button><button id="tab-fixtures" role="tab" data-view="fixtures">赛程赛果</button><button id="tab-tables" role="tab" data-view="tables">积分榜</button></div><button class="rules-button" id="rules-toggle" aria-expanded="false" aria-controls="rules">赛事规则 <span aria-hidden="true">⌄</span></button></div><div id="rules" class="rules" hidden></div>
<div class="filters"><label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="搜索球队" aria-label="搜索球队" autocomplete="off"></label><label><span class="sr-only">选择小组</span><select id="group" aria-label="选择小组"></select></label><label><span class="sr-only">选择轮次</span><select id="round" aria-label="选择轮次"></select></label><button id="own" class="own-filter" aria-pressed="false">◎ 我的球队</button><span id="count" class="count" aria-live="polite"></span></div>
<section id="panel-bracket" class="view-panel" role="tabpanel" aria-labelledby="tab-bracket"><div class="bracket-top"><div><h2 id="bracket-title">晋级之路</h2><p>拖动浏览 · 点击对阵查看详情</p></div><div class="zoom"><button id="zoom-out" aria-label="缩小对阵图">−</button><button id="zoom-fit" aria-label="适应对阵图宽度">适应</button><button id="zoom-in" aria-label="放大对阵图">＋</button><output id="zoom-label">100%</output></div></div><div id="bracket-viewport" class="bracket-viewport" tabindex="0" aria-label="可滚动淘汰赛对阵图"><div id="bracket-space"><div id="bracket-canvas"></div></div></div><div class="legend"><span><i class="blue"></i>我的球队</span><span><i></i>已完成</span><span>虚线框 · 尚未生成</span><span id="bracket-hint"></span></div></section>
<section id="panel-fixtures" class="view-panel" role="tabpanel" aria-labelledby="tab-fixtures" hidden><div id="fixtures"></div><div id="pagination" class="pagination"></div></section>
<section id="panel-tables" class="view-panel" role="tabpanel" aria-labelledby="tab-tables" hidden><div id="tables"></div></section></div>
<footer><span><i></i> 已保存赛事进度</span><span id="save-note">返回游戏继续比赛</span></footer></main></div>
<dialog id="detail"><div class="dialog-heading"><span>对阵详情</span><button id="detail-close" aria-label="关闭对阵详情">×</button></div><div id="detail-body"></div></dialog><div id="toast" role="status" hidden></div>
<script id="schedule-data" type="application/json">SCHEDULE_DATA</script><script>/*SCHEDULE_JS*/</script></body></html>
